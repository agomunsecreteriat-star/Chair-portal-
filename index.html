<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGOMUN - Chair Portal</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Navigasyon & Tablo Stilleri */
        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .nav-btn {
            background: var(--accent-green);
            color: var(--warm-cream);
            border: 1px solid var(--accent-orange);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
        }
        .nav-btn.active {
            background: var(--accent-orange);
            color: var(--dark-green);
        }
        .eval-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
        }
        .eval-form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .eval-form label {
            font-size: 0.85rem;
            color: var(--accent-orange);
            font-weight: bold;
        }
        .score-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .eval-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 0.85rem;
        }
        .eval-table th, .eval-table td {
            border: 1px solid rgba(224, 122, 95, 0.3);
            padding: 8px;
            text-align: left;
        }
        .eval-table th {
            background: var(--dark-green);
            color: var(--accent-orange);
        }
    </style>
</head>
<body>

    <!-- GİRİŞ EKRANI -->
    <div id="login-overlay">
        <div class="login-card">
            <div style="text-align:center; margin-bottom: 10px;">
                <svg width="80" height="80" viewBox="0 0 200 200">
                    <circle cx="100" cy="100" r="90" fill="none" stroke="#e07a5f" stroke-width="4"/>
                    <path d="M 100 20 L 130 50 L 120 50 L 120 120 L 80 120 L 80 50 L 70 50 Z" fill="#e07a5f"/>
                    <text x="100" y="150" font-family="Arial" font-size="22" fill="#f4ece1" font-weight="bold" text-anchor="middle">AGOMUN</text>
                </svg>
            </div>
            <h2>AGOMUN</h2>
            <p>Chair Portal Access</p>
            
            <form onsubmit="handleLogin(event)">
                <input type="text" id="username" placeholder="Username" required autocomplete="off"><br>
                <input type="password" id="password" placeholder="Password" required><br>
                <button type="submit">Login</button>
            </form>

            <p id="error-msg" style="color: #ff6b6b; display: none; margin-top: 15px; font-weight: bold;">
                Invalid username or password!
            </p>
        </div>
    </div>

    <!-- PORTAL İÇERİĞİ -->
    <div id="portal-content" style="display: none;">
        <header class="main-header">
            <div class="brand-container" style="display: flex; align-items: center; gap: 12px;">
                <svg width="45" height="45" viewBox="0 0 200 200">
                    <circle cx="100" cy="100" r="85" fill="none" stroke="#e07a5f" stroke-width="8"/>
                    <text x="100" y="115" font-family="Arial" font-size="45" fill="#e07a5f" font-weight="bold" text-anchor="middle">🏛️</text>
                </svg>
                <div class="brand-text">
                    <span class="brand-title" style="font-size: 1.4rem; font-weight: bold; color: #e07a5f; display: block;">AGOMUN</span>
                    <span class="brand-subtitle" style="font-size: 0.65rem; color: #f4ece1; letter-spacing: 1px; opacity: 0.8;">AGORA MODEL UNITED NATIONS</span>
                </div>
            </div>
            
            <button onclick="logout()" class="logout-btn">Logout</button>
        </header>

        <!-- SEKMELER (SAYFA GEÇİŞİ) -->
        <div class="nav-tabs">
            <button id="tab-dash" class="nav-btn active" onclick="switchTab('dashboard')">📌 Chair Dashboard</button>
            <button id="tab-eval" class="nav-btn" onclick="switchTab('evaluation')">⭐ Delegate Evaluation</button>
        </div>

        <!-- SAYFA 1: DASHBOARD -->
        <div id="page-dashboard" class="portal-grid">
            <div class="left-column">
                <section class="card">
                    <h2>⏱️ Committee Timer</h2>
                    <div id="timer-display">00:00</div>
                    
                    <div class="timer-custom-row">
                        <input type="number" id="manual-min" placeholder="Min" min="0">
                        <span>:</span>
                        <input type="number" id="manual-sec" placeholder="Sec" min="0" max="59">
                        <button onclick="startManualTimer()">Start Custom</button>
                    </div>

                    <div class="timer-btn-row">
                        <button onclick="startTimer(60)">1 Min</button>
                        <button onclick="startTimer(90)">90 Sec</button>
                        <button onclick="pauseTimer()">Pause</button>
                        <button onclick="resetTimer()">Reset</button>
                    </div>
                </section>

                <section class="card">
                    <h2>📜 Motion Log</h2>
                    <div class="motion-input-group">
                        <input type="text" id="motion-text" placeholder="Type motion here (e.g. 10 min Mod Caucus on...)">
                        <button onclick="addMotion()">Add Motion</button>
                    </div>
                    <ul id="motionList" class="motion-list"></ul>
                </section>
            </div>

            <div class="right-column">
                <section class="card gsl-card">
                    <h2>📜 General Speakers List (GSL)</h2>
                    <div class="input-group">
                        <input type="text" id="delegateInput" placeholder="Delegate name / Country...">
                        <button onclick="addSpeaker()">Add</button>
                    </div>
                    <ol id="speakerList"></ol>
                </section>
            </div>
        </div>

        <!-- SAYFA 2: EVALUATION (DELEGE PUANLAMA) -->
        <div id="page-evaluation" style="display: none;">
            <div class="eval-grid">
                
                <!-- PUAN GİRİŞ FORMU -->
                <section class="card">
                    <h2>📝 Score Delegate</h2>
                    <form onsubmit="saveEvaluation(event)" class="eval-form">
                        <label>Delegate Name & Country</label>
                        <input type="text" id="eval-name" placeholder="e.g. John Doe (Canada)" required>

                        <div class="score-inputs">
                            <div>
                                <label>GSL / Speech (1-10)</label>
                                <input type="number" id="score-speech" min="1" max="10" required>
                            </div>
                            <div>
                                <label>Position Paper (1-10)</label>
                                <input type="number" id="score-paper" min="1" max="10" required>
                            </div>
                            <div>
                                <label>Lobbying & Debate (1-10)</label>
                                <input type="number" id="score-lobby" min="1" max="10" required>
                            </div>
                            <div>
                                <label>Resolution / Draft (1-10)</label>
                                <input type="number" id="score-draft" min="1" max="10" required>
                            </div>
                        </div>

                        <label>Chair Notes</label>
                        <input type="text" id="eval-notes" placeholder="Optional comments...">

                        <button type="submit" style="margin-top: 10px;">Save Score</button>
                    </form>
                </section>

                <!-- SKOR TABLOSU -->
                <section class="card">
                    <h2>📊 Evaluation Board</h2>
                    <table class="eval-table">
                        <thead>
                            <tr>
                                <th>Delegate</th>
                                <th>Speech</th>
                                <th>Paper</th>
                                <th>Lobby</th>
                                <th>Draft</th>
                                <th>Avg Score</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="evalTableBody">
                            <!-- Puanlar Buraya Eklenecek -->
                        </tbody>
                    </table>
                </section>

            </div>
        </div>

    </div>

    <script>
        const CHAIR_USER = "chair1";
        const CHAIR_PASS = "mun2026";
        const ADMIN_USER = "admin";
        const ADMIN_PASS = "chairportal123";

        document.addEventListener("DOMContentLoaded", function() {
            if (sessionStorage.getItem("isLoggedIn") === "true") {
                showPortal();
            }
        });

        function handleLogin(event) {
            event.preventDefault();
            const userEntered = document.getElementById("username").value.trim().toLowerCase();
            const passEntered = document.getElementById("password").value.trim();
            const errorMsg = document.getElementById("error-msg");

            if ((userEntered === CHAIR_USER && passEntered === CHAIR_PASS) || 
                (userEntered === ADMIN_USER && passEntered === ADMIN_PASS)) {
                sessionStorage.setItem("isLoggedIn", "true");
                errorMsg.style.display = "none";
                showPortal();
            } else {
                errorMsg.style.display = "block";
            }
        }

        function logout() {
            sessionStorage.removeItem("isLoggedIn");
            location.reload();
        }

        function showPortal() {
            document.getElementById("login-overlay").style.display = "none";
            document.getElementById("portal-content").style.display = "block";
        }

        // SEKMELER ARASI GEÇİŞ
        function switchTab(tabName) {
            const dashPage = document.getElementById("page-dashboard");
            const evalPage = document.getElementById("page-evaluation");
            const dashBtn = document.getElementById("tab-dash");
            const evalBtn = document.getElementById("tab-eval");

            if (tabName === 'dashboard') {
                dashPage.style.display = "grid";
                evalPage.style.display = "none";
                dashBtn.classList.add("active");
                evalBtn.classList.remove("active");
            } else {
                dashPage.style.display = "none";
                evalPage.style.display = "block";
                dashBtn.classList.remove("active");
                evalBtn.classList.add("active");
            }
        }

        // DELEGE PUANLAMA MANTIĞI
        function saveEvaluation(event) {
            event.preventDefault();

            const name = document.getElementById("eval-name").value;
            const sSpeech = parseFloat(document.getElementById("score-speech").value) || 0;
            const sPaper = parseFloat(document.getElementById("score-paper").value) || 0;
            const sLobby = parseFloat(document.getElementById("score-lobby").value) || 0;
            const sDraft = parseFloat(document.getElementById("score-draft").value) || 0;

            const avg = ((sSpeech + sPaper + sLobby + sDraft) / 4).toFixed(1);

            const tbody = document.getElementById("evalTableBody");
            const tr = document.createElement("tr");

            tr.innerHTML = `
                <td><strong>${name}</strong></td>
                <td>${sSpeech}</td>
                <td>${sPaper}</td>
                <td>${sLobby}</td>
                <td>${sDraft}</td>
                <td><strong style="color: var(--accent-orange);">${avg} / 10</strong></td>
                <td><button onclick="this.parentElement.parentElement.remove()" class="remove-btn">✕</button></td>
            `;

            tbody.appendChild(tr);

            // Formu Temizle
            event.target.reset();
        }

        // TIMER MANTIĞI
        let timer;
        let timeLeft = 0;
        let isPaused = false;

        function startTimer(seconds) {
            clearInterval(timer);
            timeLeft = seconds;
            isPaused = false;
            runTimer();
        }

        function startManualTimer() {
            const mins = parseInt(document.getElementById('manual-min').value) || 0;
            const secs = parseInt(document.getElementById('manual-sec').value) || 0;
            const total = (mins * 60) + secs;

            if (total > 0) {
                startTimer(total);
            } else {
                alert("Please enter a valid time!");
            }
        }

        function runTimer() {
            updateDisplay();
            timer = setInterval(() => {
                if (timeLeft > 0) {
                    timeLeft--;
                    updateDisplay();
                } else {
                    clearInterval(timer);
                    alert("Time is up!");
                }
            }, 1000);
        }

        function pauseTimer() {
            if (!isPaused && timeLeft > 0) {
                clearInterval(timer);
                isPaused = true;
            } else if (isPaused && timeLeft > 0) {
                isPaused = false;
                runTimer();
            }
        }

        function resetTimer() {
            clearInterval(timer);
            timeLeft = 0;
            isPaused = false;
            updateDisplay();
        }

        function updateDisplay() {
            const mins = Math.floor(timeLeft / 60).toString().padStart(2, '0');
            const secs = (timeLeft % 60).toString().padStart(2, '0');
            document.getElementById('timer-display').innerText = `${mins}:${secs}`;
        }

        // MOTION MANTIĞI
        function addMotion() {
            const input = document.getElementById('motion-text');
            const text = input.value.trim();

            if (text === '') return;

            const ul = document.getElementById('motionList');
            const li = document.createElement('li');
            li.className = 'motion-item';

            li.innerHTML = `
                <span class="motion-title">${text}</span>
                <div class="motion-btn-group">
                    <button onclick="setStatus(this, 'passed')" class="status-btn pass">Passed</button>
                    <button onclick="setStatus(this, 'failed')" class="status-btn fail">Failed</button>
                    <button onclick="this.parentElement.parentElement.remove()" class="remove-btn">✕</button>
                </div>
            `;

            ul.appendChild(li);
            input.value = '';
        }

        function setStatus(btn, status) {
            const item = btn.closest('.motion-item');
            if (!item) return;

            item.classList.remove('status-passed', 'status-failed');
            
            if (status === 'passed') {
                item.classList.add('status-passed');
            } else if (status === 'failed') {
                item.classList.add('status-failed');
            }
        }

        // GSL MANTIĞI
        function addSpeaker() {
            const input = document.getElementById('delegateInput');
            if (input.value.trim() !== '') {
                const li = document.createElement('li');
                li.innerHTML = `${input.value} <button onclick="this.parentElement.remove()" class="remove-btn">✓ Done</button>`;
                document.getElementById('speakerList').appendChild(li);
                input.value = '';
            }
        }
    </script>
</body>
</html>
