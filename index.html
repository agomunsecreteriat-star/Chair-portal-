<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGORA MUN — Chair Portal</title>
    <style>
        :root {
            --green: #173b32;
            --green2: #28584b;
            --cream: #f7e8d3;
            --cream2: #fffaf2;
            --orange: #d98b55;
            --orange2: #c97742;
            --text: #24312d;
            --muted: #718078;
            --border: #dfd1bd;
            --red: #b94d47;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background: var(--cream); color: var(--text); min-height: 100vh; }

        /* Login Ekranı */
        #loginScreen {
            position: fixed; inset: 0; background: var(--green);
            display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 99999;
        }
        .loginBox {
            width: 100%; max-width: 400px; background: var(--cream2);
            padding: 35px; border-radius: 20px; box-shadow: 0 25px 60px rgba(0,0,0,0.3);
        }
        .logo { text-align: center; margin-bottom: 30px; }
        .logoCircle {
            width: 70px; height: 70px; border-radius: 50%; background: var(--orange);
            color: var(--green); display: flex; justify-content: center; align-items: center;
            margin: auto auto 15px; font-size: 30px; font-weight: 900;
        }
        .formGroup { margin-bottom: 16px; }
        label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 7px; }
        input, select { width: 100%; padding: 11px; border: 1px solid var(--border); border-radius: 8px; }
        .loginButton {
            width: 100%; padding: 12px; background: var(--orange); color: white;
            border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer;
        }

        /* Dashboard */
        #app { display: none; padding: 20px; max-width: 1200px; margin: auto; }
        header { 
            display: flex; justify-content: space-between; align-items: center; 
            background: var(--green); color: var(--cream); padding: 15px 25px; 
            border-radius: 15px; margin-bottom: 20px; 
        }
        .logoutBtn { background: var(--red); color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }
        .card { background: var(--cream2); border: 1px solid var(--border); border-radius: 15px; padding: 20px; }
        .btn { width: 100%; padding: 10px; background: var(--orange); color: white; border: none; border-radius: 6px; cursor: pointer; margin-top: 5px; }
        .timerDisplay { font-size: 48px; font-weight: bold; text-align: center; color: var(--green); margin: 15px 0; }
        .list { list-style: none; margin-top: 10px; }
        .list li { background: white; padding: 10px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; }
    </style>
</head>
<body>

    <!-- Login Ekranı -->
    <div id="loginScreen">
        <div class="loginBox">
            <div class="logo"><div class="logoCircle">A</div><h1>AGORA MUN</h1></div>
            <form id="loginForm">
                <div class="formGroup">
                    <label>Committee</label>
                    <select id="committee" required>
                        <option value="DISEC">DISEC</option>
                        <option value="UNHCR">UNHCR</option>
                        <option value="ECOFIN">ECOFIN</option>
                    </select>
                </div>
                <div class="formGroup">
                    <label>Chair Passcode</label>
                    <input type="password" id="passcode" placeholder="Şifre: agora2026" required>
                </div>
                <button type="submit" class="loginButton">Enter Portal</button>
            </form>
        </div>
    </div>

    <!-- Dashboard -->
    <div id="app">
        <header>
            <div class="headerTitle">AGORA MUN — <span id="displayCommittee"></span></div>
            <button class="logoutBtn" onclick="location.reload()">Exit</button>
        </header>

        <div class="grid">
            <div class="card">
                <h2>Session Timer</h2>
                <div class="timerDisplay" id="timer">01:30</div>
                <button class="btn" onclick="startTimer()">Start</button>
                <button class="btn" onclick="clearInterval(timerInterval)">Pause</button>
            </div>
            
            <div class="card">
                <h2>Speakers List</h2>
                <input type="text" id="speakerInput" placeholder="Delege Adı...">
                <button class="btn" onclick="addSpeaker()">Add to GSL</button>
                <ul class="list" id="speakersList"></ul>
            </div>
        </div>
    </div>

    <script>
        // Login Mantığı
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const pass = document.getElementById('passcode').value;
            const comm = document.getElementById('committee').value;

            if (pass === "agora2026") {
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('app').style.display = 'block';
                document.getElementById('displayCommittee').innerText = comm;
            } else {
                alert("Hatalı şifre!");
            }
        });

        // Timer Mantığı
        let timeLeft = 90;
        let timerInterval;
        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                let m = Math.floor(timeLeft / 60);
                let s = timeLeft % 60;
                document.getElementById('timer').innerText = `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
                if(timeLeft <= 0) clearInterval(timerInterval);
            }, 1000);
        }

        // Liste Mantığı
        function addSpeaker() {
            let name = document.getElementById('speakerInput').value;
            if(name) {
                let li = document.createElement('li');
                li.innerText = name;
                document.getElementById('speakersList').appendChild(li);
                document.getElementById('speakerInput').value = '';
            }
        }
    </script>
</body>
</html>
