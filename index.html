<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AGORA MUN — Chair Portal</title>

<style>
:root{
    --green:#173b32;
    --green2:#28584b;
    --green3:#376f60;
    --cream:#f7e8d3;
    --cream2:#fffaf2;
    --white:#fff;
    --orange:#d98b55;
    --orange2:#c97742;
    --text:#24312d;
    --muted:#718078;
    --border:#dfd1bd;
    --red:#b94d47;
    --red2:#9e3f3a;
    --yellow:#c79a35;
    --shadow:0 10px 30px rgba(23,59,50,.10);
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:var(--cream);
    color:var(--text);
    min-height:100vh;
}

/* ================= LOGIN ================= */

#loginScreen{
    position:fixed;
    inset:0;
    background:
        radial-gradient(circle at top right,rgba(217,139,85,.18),transparent 30%),
        var(--green);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    z-index:9999;
}

.loginBox{
    width:100%;
    max-width:420px;
    background:var(--cream2);
    padding:38px;
    border-radius:22px;
    box-shadow:0 30px 80px rgba(0,0,0,.3);
}

.logo{
    text-align:center;
    margin-bottom:30px;
}

.logoCircle{
    width:76px;
    height:76px;
    border-radius:50%;
    background:var(--orange);
    color:var(--green);
    display:flex;
    justify-content:center;
    align-items:center;
    margin:0 auto 15px;
    font-size:32px;
    font-weight:900;
}

.logo h1{
    color:var(--green);
    letter-spacing:3px;
}

.logo p{
    color:var(--muted);
    margin-top:6px;
}

.formGroup{
    margin-bottom:16px;
}

label{
    display:block;
    font-size:13px;
    font-weight:bold;
    color:var(--green);
    margin-bottom:7px;
}

input,
select,
textarea{
    width:100%;
    padding:11px 12px;
    border:1px solid var(--border);
    border-radius:8px;
    background:white;
    color:var(--text);
    outline:none;
    font-family:Arial,sans-serif;
}

textarea{
    resize:vertical;
    min-height:120px;
}

input:focus,
select:focus,
textarea:focus{
    border-color:var(--orange);
    box-shadow:0 0 0 3px rgba(217,139,85,.12);
}

.loginButton{
    width:100%;
    padding:12px;
    background:var(--orange);
    color:white;
    border:none;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
}

.loginButton:hover{
    background:var(--orange2);
}

    margin
