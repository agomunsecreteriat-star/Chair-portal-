<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MUN Chair Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- GİRİŞ EKRANI -->
    <div id="login-overlay">
        <div class="login-card">
            <h2>🔐 Chair Access Only</h2>
            <p>Please enter your committee credentials</p>
            <input type="text" id="username" placeholder="Username">
            <input type="password" id="password" placeholder="Password">
            <button onclick="login()">Login</button>
            <p id="error-msg" style="color: #e07a5f; display: none; margin-top: 10px;">Invalid username or password!</p>
        </div>
    </div>

    <!-- PORTAL İÇERİĞİ (Giriş yapılana kadar gizli) -->
    <div id="portal-content" style="display: none;">
        <header>
            <h1>🏛️ MUN Chair Portal</h1>
            <p>Committee Dashboard & Desk Tools</p>
            <button onclick="logout()" class="logout-btn">Logout</button>
        </header>

        <div class="container">
            <section class="card">
                <h2>⏱️ General Timer</h2>
                <div id="timer-display">00:00</div>
                <button onclick="startTimer(60)">1 Min</button>
                <button onclick="startTimer(90)">90 Sec</button>
                <button onclick="resetTimer()">Reset</button>
            </section>

            <section class="card">
                <h2>📜 General Speakers List (GSL)</h2>
                <input type="text" id="delegateInput" placeholder="Delegate name / Country...">
                <button onclick="addSpeaker()">Add Speaker</button>
                <ol id="speakerList"></ol>
            </section>
        </div>
    </div>

    <script>
        // İzin verilen Chair kullanıcı adı ve şifreleri
        const chairCredentials = {
            "chair1": "mun2026pass",
            "chair2": "secgenSecret",
            "disec_chair": "disec123"
        };

        // Sayfa yüklendiğinde oturum durumunu kontrol et
        window.onload = function() {
            if (sessionStorage.getItem("isLoggedIn") === "true") {
                showPortal();
            }
        };

        function login() {
            const user = document.getElementById("username").value;
            const pass = document.getElementById("password").value;

            if (chairCredentials[user] && chairCredentials[user] === pass) {
                sessionStorage.setItem("isLoggedIn", "true");
                showPortal();
            } else {
                document.getElementById("error-msg").style.display = "block";
            }
        }

        function logout() {
            sessionStorage.removeItem("isLoggedIn");
            location.reload();
        }

        function showPortal() {
            document.getElementById("login-overlay").style.display = "none";
            document.getElementById("portal-content").style.display = "block";
        }

        // Timer ve Speaker işlemleri kodları buraya devam eder...
    </script>
</body>
</html>
