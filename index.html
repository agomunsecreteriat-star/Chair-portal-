<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MUN Chair Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- GİRİŞ EKRANI -->
    <div id="login-overlay">
        <div class="login-card">
            <h2>🔐 Chair Access Only</h2>
            <p>Please enter your credentials</p>
            
            <form onsubmit="handleLogin(event)">
                <input type="text" id="username" placeholder="Username" required autocomplete="off"><br>
                <input type="password" id="password" placeholder="Password" required><br>
                <button type="submit">Login</button>
            </form>

            <p id="error-msg" style="color: #ff6b6b; display: none; margin-top: 15px; font-weight: bold;">
                Invalid username or password!
            </p>
        </div>
    </div>

    <!-- PORTAL İÇERİĞİ -->
    <div id="portal-content" style="display: none;">
        <header>
            <h1>🏛️ MUN Chair Portal</h1>
            <p>Committee Dashboard & Desk Tools</p>
            <button onclick="logout()" class="logout-btn">Logout</button>
        </header>

        <div class="container">
            
            <!-- MANUEL ZAMANLAYICI -->
            <section class="card">
                <h2>⏱️ Committee Timer</h2>
                <div id="timer-display">00:00</div>
                
                <div class="custom-timer-inputs">
                    <input type="number" id="custom-min" placeholder="Min" min="0" max="180">
                    <span>:</span>
                    <input type="number" id="custom-sec" placeholder="Sec" min="0" max="59">
                    <button onclick="startCustomTimer()">Set & Start</button>
                </div>

                <div style="margin-top: 10px;">
                    <button onclick="startTimer(60)">1 Min</button>
                    <button onclick="startTimer(90)">90 Sec</button>
                    <button onclick="pauseTimer()">Pause</button>
                    <button onclick="resetTimer()">Reset</button>
                </div>
            </section>

            <!-- MOTION (ÖNERGE) TAKİP MODÜLÜ -->
            <section class="card motion-card">
                <h2>📜 Motion Log</h2>
                <div class="motion-form">
                    <input type="text" id="motion-delegate" placeholder="Proposing Country (e.g. Canada)">
                    <select id="motion-type">
                        <option value="Moderated Caucus">Moderated Caucus</option>
                        <option value="Unmoderated Caucus">Unmoderated Caucus</option>
                        <option value="Consultation of Whole">Consultation of Whole</option>
                        <option value="Closure of Debate">Closure of Debate</option>
                    </select>
                    <div class="motion-times">
                        <input type="text" id="motion-total" placeholder="Total Time (e.g. 10m)">
                        <input type="text" id="motion-speaking" placeholder="Speaking Time (e.g. 60s)">
                    </div>
                    <input type="text" id="motion-topic" placeholder="Topic / Purpose">
                    <button onclick="addMotion()">Add Motion</button>
                </div>

                <div class="motion-list-container">
                    <h3>Raised Motions</h3>
                    <ul id="motionList" class="motion-list"></ul>
                </div>
            </section>

            <!-- GENERAL SPEAKERS LIST (GSL) -->
            <section class="card">
                <h2>📜 General Speakers List (GSL)</h2>
                <div class="input-group">
                    <input type="text" id="delegateInput" placeholder="Delegate name / Country...">
                    <button onclick="addSpeaker()">Add</button>
                </div>
                <ol id="speakerList"></ol>
            </section>

        </div>
    </div>

    <script>
        // 1. KULLANICI ADI VE ŞİFRE TANIMLARI
        const CHAIR_USER = "chair1";
        const CHAIR_PASS = "mun2026";

        const ADMIN_USER = "admin";
        const ADMIN_PASS = "chairportal123";

        // Sayfa yüklendiğinde oturum açık mı kontrol et
        document.addEventListener("DOMContentLoaded", function() {
            if (sessionStorage.getItem("isLoggedIn") === "true") {
                showPortal();
            }
        });

        // Giriş Mantığı
        function handleLogin(event) {
            event.preventDefault();

            const userEntered = document.getElementById("username").value.trim().toLowerCase();
            const passEntered = document.getElementById("password").value.trim();
            const errorMsg = document.getElementById("error-msg");

            const isChair = (userEntered === CHAIR_USER && passEntered === CHAIR_PASS);
            const isAdmin = (userEntered === ADMIN_USER && passEntered === ADMIN_PASS);

            if (isChair || isAdmin) {
                sessionStorage.setItem("isLoggedIn", "true");
                errorMsg.style.display = "none";
                showPortal();
            } else {
                errorMsg.style.display = "block";
            }
        }

        function logout() {
            sessionStorage.removeItem("isLoggedIn");
            location.reload();
        }

        function showPortal() {
            document.getElementById("login-overlay").style.display = "none";
            document.getElementById("portal-content").style.display = "block";
        }

        // --------------------------------------------------
        // ZAMANLAYICI MANTIĞI
        // --------------------------------------------------
        let timer;
        let timeLeft = 0;
        let isPaused = false;

        function startTimer(seconds) {
            clearInterval(timer);
            timeLeft = seconds;
            isPaused = false;
            runTimer();
        }

        function startCustomTimer() {
            const minInput = parseInt(document.getElementById('custom-min').value) || 0;
            const secInput = parseInt(document.getElementById('custom-sec').value) || 0;
            
            const totalSeconds = (minInput * 60) + secInput;
            if (totalSeconds > 0) {
                startTimer(totalSeconds);
                document.getElementById('custom-min').value = '';
                document.getElementById('custom-sec').value = '';
            } else {
                alert("Please enter a valid time!");
            }
        }

        function runTimer() {
            updateDisplay();
            timer = setInterval(() => {
                if (timeLeft > 0) {
                    timeLeft--;
                    updateDisplay();
                } else {
                    clearInterval(timer);
                    alert("Time is up!");
                }
            }, 1000);
        }

        function pauseTimer() {
            if (!isPaused && timeLeft > 0) {
                clearInterval(timer);
                isPaused = true;
            } else if (isPaused && timeLeft > 0) {
                isPaused = false;
                runTimer();
            }
        }

        function resetTimer() {
            clearInterval(timer);
            timeLeft = 0;
            isPaused = false;
            updateDisplay();
        }

        function updateDisplay() {
            const mins = Math.floor(timeLeft / 60).toString().padStart(2, '0');
            const secs = (timeLeft % 60).toString().padStart(2, '0');
            document.getElementById('timer-display').innerText = `${mins}:${secs}`;
        }

        // --------------------------------------------------
        // MOTION (ÖNERGE) MANTIĞI
        // --------------------------------------------------
        function addMotion() {
            const delegate = document.getElementById('motion-delegate').value.trim();
            const type = document.getElementById('motion-type').value;
            const total = document.getElementById('motion-total').value.trim();
            const speaking = document.getElementById('motion-speaking').value.trim();
            const topic = document.getElementById('motion-topic').value.trim();

            if (!delegate || !topic) {
                alert("Please fill in at least the Country and Topic fields!");
                return;
            }

            const motionList = document.getElementById('motionList');
            const li = document.createElement('li');
            li.className = 'motion-item';

            let timeDetails = total ? ` (${total}${speaking ? ' - ' + speaking + '/sp' : ''})` : '';

            li.innerHTML = `
                <div class="motion-info">
                    <strong>${delegate}</strong>: ${type}${timeDetails}
                    <br><small><em>"${topic}"</em></small>
                </div>
                <div class="motion-actions">
                    <button onclick="markStatus(this, 'passed')" class="pass-btn">Pass</button>
                    <button onclick="markStatus(this, 'failed')" class="fail-btn">Fail</button>
                    <button onclick="this.parentElement.parentElement.remove()" class="remove-btn">✕</button>
                </div>
            `;

            motionList.appendChild(li);

            // Form alanlarını temizle
            document.getElementById('motion-delegate').value = '';
            document.getElementById('motion-total').value = '';
            document.getElementById('motion-speaking').value = '';
            document.getElementById('motion-topic').value = '';
        }

        function markStatus(btn, status) {
            const item = btn.parentElement.parentElement;
            item.classList.remove('status-passed', 'status-failed');
            if (status === 'passed') {
                item.classList.add('status-passed');
            } else if (status === 'failed') {
                item.classList.add('status-failed');
            }
        }

        // --------------------------------------------------
        // GSL MANTIĞI
        // --------------------------------------------------
        function addSpeaker() {
            const input = document.getElementById('delegateInput');
            if (input.value.trim() !== '') {
                const li = document.createElement('li');
                li.innerHTML = `${input.value} <button onclick="this.parentElement.remove()" class="remove-btn">✓ Done</button>`;
                document.getElementById('speakerList').appendChild(li);
                input.value = '';
            }
        }
    </script>
</body>
</html>
