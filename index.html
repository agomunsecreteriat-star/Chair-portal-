<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AGOMUN Portal</title>
    <style>
        body { background: #1d3557; color: #f4ece1; font-family: sans-serif; }
        #login-overlay { position: fixed; top:0; left:0; width: 100%; height:100%; background: #1d3557; display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .login-box { background: #264653; padding: 30px; border-radius: 10px; text-align: center; border: 2px solid #e07a5f; }
        input { display: block; width: 200px; margin: 10px auto; padding: 10px; }
        button { background: #e07a5f; border: none; padding: 10px 20px; color: white; cursor: pointer; }
    </style>
</head>
<body>

    <!-- GİRİŞ EKRANI -->
    <div id="login-overlay">
        <div class="login-box">
            <h2>Giriş Yap</h2>
            <input type="text" id="user" placeholder="Kullanıcı Adı (admin)">
            <input type="password" id="pass" placeholder="Şifre (1234)">
            <button onclick="checkLogin()">Giriş</button>
        </div>
    </div>

    <!-- ANA PANEL (Başta gizli) -->
    <div id="main-content" style="display: none; padding: 20px;">
        <h1>Hoş Geldin, Chair!</h1>
        <p>Burası giriş yaptıktan sonra açılan güvenli alan.</p>
        <button onclick="location.reload()">Çıkış Yap</button>
    </div>

    <script>
        function checkLogin() {
            const u = document.getElementById('user').value.trim();
            const p = document.getElementById('pass').value.trim();

            if (u === "admin" && p === "1234") {
                document.getElementById('login-overlay').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';
                console.log("Başarıyla giriş yapıldı.");
            } else {
                alert("Hatalı kullanıcı adı veya şifre!");
                console.error("Giriş başarısız. Girilen: " + u + "/" + p);
            }
        }
    </script>
</body>
</html>
