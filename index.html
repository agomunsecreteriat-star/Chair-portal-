<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGORA MUN — Chair Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- LOGIN SCREEN -->
    <div id="loginScreen">
        <div class="loginBox">
            <div class="logo">
                <div class="logoCircle">A</div>
                <h1>AGORA MUN</h1>
                <p>Chairperson Portal</p>
            </div>
            <form id="loginForm">
                <div class="formGroup">
                    <label for="committee">Committee</label>
                    <select id="committee" required>
                        <option value="">Select Committee...</option>
                        <option value="DISEC">DISEC</option>
                        <option value="UNHCR">UNHCR</option>
                        <option value="ECOFIN">ECOFIN</option>
                        <option value="SECURITY COUNCIL">UNSC</option>
                    </select>
                </div>
                <div class="formGroup">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Username (chair)" required>
                </div>
                <div class="formGroup">
                    <label for="passcode">Chair Passcode</label>
                    <input type="password" id="passcode" placeholder="Passcode (agora2026)" required>
                </div>
                <button type="submit" class="loginButton">Enter Portal</button>
            </form>
        </div>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="app">
        <header>
            <div class="headerTitle">AGORA MUN — <span id="displayCommittee">Committee</span></div>
            <button class="logoutBtn" id="logoutBtn">Exit Portal</button>
        </header>

        <div class="grid">
            <!-- TIMER CARD -->
            <div class="card">
                <h2>Session Timer</h2>
                <div class="timerDisplay" id="timer">01:30</div>
                <div class="timerControls">
                    <button class="btn" id="startTimerBtn">Start</button>
                    <button class="btn btn-secondary" id="pauseTimerBtn">Pause</button>
                    <button class="btn btn-danger" id="resetTimerBtn">Reset</button>
                </div>
            </div>

            <!-- SPEAKERS LIST CARD -->
            <div class="card">
                <h2>General Speakers List (GSL)</h2>
                <div class="formGroupInline">
                    <input type="text" id="speakerInput" placeholder="Country name...">
                    <button class="btn btn-inline" id="addSpeakerBtn">Add</button>
                </div>
                <ul class="list" id="speakersList"></ul>
            </div>

            <!-- VOTING CARD -->
            <div class="card">
                <h2>Voting Counter</h2>
                <div class="formGroup">
                    <label for="voteFavor">In Favor</label>
                    <input type="number" id="voteFavor" value="0" min="0">
                </div>
                <div class="formGroup">
                    <label for="voteAgainst">Against</label>
                    <input type="number" id="voteAgainst" value="0" min="0">
                </div>
                <div class="formGroup">
                    <label for="voteAbstain">Abstain</label>
                    <input type="number" id="voteAbstain" value="0" min="0">
                </div>
                <button class="btn btn-secondary" id="resetVotesBtn">Reset Votes</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
