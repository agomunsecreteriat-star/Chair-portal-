<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AGORA MUN — Chair Portal</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    background: #0b2119;
    color: #f8f1d4;
    min-height: 100vh;
}

/* ================= LOGIN ================= */

#loginPage {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background:
        radial-gradient(circle at top, #173d2d, #081811 70%);
}

.login-box {
    width: 380px;
    max-width: 90%;
    padding: 40px;
    border-radius: 20px;
    background: rgba(20, 55, 41, 0.95);
    border: 1px solid #d8b84c;
    box-shadow: 0 20px 60px rgba(0,0,0,.4);
    text-align: center;
}

.logo {
    font-size: 34px;
    font-weight: bold;
    color: #f2ce52;
    margin-bottom: 8px;
}

.subtitle {
    color: #ddd6b8;
    margin-bottom: 30px;
}

.input {
    width: 100%;
    padding: 13px;
    margin: 8px 0;
    border-radius: 10px;
    border: 1px solid #526d60;
    background: #0c241a;
    color: white;
    outline: none;
}

.input:focus {
    border-color: #f2ce52;
}

.btn {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 10px;
    background: #f2ce52;
    color: #0b2119;
    font-weight: bold;
    cursor: pointer;
    margin-top: 12px;
}

.btn:hover {
    background: #ffe37a;
}

.error {
    color: #ff8b8b;
    margin-top: 12px;
    display: none;
}

/* ================= APP ================= */

    min-height: 100vh;
}

    justify-content: space-between;
    padding: 0 25px;
}
