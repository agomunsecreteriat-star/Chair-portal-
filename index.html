<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MUN Chair Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- GİRİŞ EKRANI -->
    <div id="login-overlay">
        <div class="login-card">
            <h2>🔐 Chair Access Only</h2>
            <p>Please enter your committee credentials</p>
            <input type="text" id="username" placeholder="Username">
            <input type="password" id="password" placeholder="Password">
            <button onclick="login()">Login</button>
            <p id="error-msg" style="color: #e07a5f; display: none; margin-top: 10px;">Invalid username or password!</p>
        </div>
    </div>

    <!-- PORTAL İÇERİĞİ (Giriş yapılana kadar gizli) -->
    <div id="portal-content" style="display: none;">
        <header>
            <h1>🏛️ MUN Chair Portal</h1>
            <p>Committee Dashboard & Desk Tools</p>
            <button onclick="logout()" class="logout-btn">Logout</button>
        </header>

        <div class="container">
            <section class="card">
                <h2>⏱️ General Timer</h2>
                <div id="timer-display">00:00</div>
                <button onclick="startTimer(60)">1 Min</button>
                <button onclick="startTimer(90)">90 Sec</button>
                <button onclick="resetTimer()">Reset</button>
            </section>

            <section class="card">
                <h2>📜 General Speakers List (GSL)</h2>
                <input type="text" id="delegateInput" placeholder="Delegate name / Country...">
                <button onclick="addSpeaker()">Add Speaker</button>
                <ol id="speakerList"></ol>
            </section>
        </div>
    </div>
<script>
    // Kullanıcı adı ve şifre listesi (Tamamı küçük harf)
    const chairCredentials = {
        "chair1": "mun2026",
        "disec_chair": "disecpass",
        "sochum_chair": "sochumpass",
        "admin": "chairportal123"
    };

    // Sayfa yüklendiğinde oturum durumunu kontrol et
    window.addEventListener("DOMContentLoaded", function() {
        if (sessionStorage.getItem("isLoggedIn") === "true") {
            showPortal();
        }
    });

    function login() {
        // Kullanıcı adını otomatik olarak küçük harfe çevirip boşlukları temizler
        const user = document.getElementById("username").value.trim().toLowerCase();
        const pass = document.getElementById("password").value.trim();
        const errorMsg = document.getElementById("error-msg");

        if (chairCredentials[user] && chairCredentials[user] === pass) {
            sessionStorage.setItem("isLoggedIn", "true");
            errorMsg.style.display = "none";
            showPortal();
        } else {
            errorMsg.style.display = "block";
        }
    }

    function logout() {
        sessionStorage.removeItem("isLoggedIn");
        location.reload();
    }

    function showPortal() {
        document.getElementById("login-overlay").style.display = "none";
        document.getElementById("portal-content").style.display = "block";
    }

    // Enter tuşuna basıldığında giriş yapmayı sağlar
    document.addEventListener("keydown", function(event) {
        if (event.key === "Enter") {
            const overlay = document.getElementById("login-overlay");
            if (overlay && overlay.style.display !== "none") {
                login();
            }
        }
    });

    // Timer İşlemleri
    let timer;
    let timeLeft = 0;

    function startTimer(seconds) {
        clearInterval(timer);
        timeLeft = seconds;
        updateDisplay();
        timer = setInterval(() => {
            if (timeLeft > 0) {
                timeLeft--;
                updateDisplay();
            } else {
                clearInterval(timer);
                alert("Time is up!");
            }
        }, 1000);
    }

    function resetTimer() {
        clearInterval(timer);
        timeLeft = 0;
        updateDisplay();
    }

    function updateDisplay() {
        const mins = Math.floor(timeLeft / 60).toString().padStart(2, '0');
        const secs = (timeLeft % 60).toString().padStart(2, '0');
        document.getElementById('timer-display').innerText = `${mins}:${secs}`;
    }

    // GSL İşlemleri
    function addSpeaker() {
        const input = document.getElementById('delegateInput');
        if (input.value.trim() !== '') {
            const li = document.createElement('li');
            li.innerHTML = `${input.value} <button onclick="this.parentElement.remove()" class="remove-btn">✓ Done</button>`;
            document.getElementById('speakerList').appendChild(li);
            input.value = '';
        }
    }
</script>
</body>
</html>
