<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AGORA MUN — Chair Portal</title>

<style>
:root{
  --green:#173b32;
  --green2:#28584b;
  --cream:#f7e8d3;
  --cream2:#fffaf2;
  --orange:#d98b55;
  --orange2:#c97742;
  --text:#24312d;
  --muted:#718078;
  --border:#dfd1bd;
  --red:#b94d47;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:var(--cream);
  color:var(--text);
}

/* ================= LOGIN ================= */

#loginScreen{
  position:fixed;
  inset:0;
  background:var(--green);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:99999;
}

.loginBox{
  width:100%;
  max-width:400px;
  background:var(--cream2);
  padding:35px;
  border-radius:20px;
  box-shadow:0 25px 60px #0005;
}

.logo{
  text-align:center;
  margin-bottom:30px;
}

.logoCircle{
  width:70px;
  height:70px;
  border-radius:50%;
  background:var(--orange);
  color:var(--green);
  display:flex;
  justify-content:center;
  align-items:center;
  margin:auto auto 15px;
  font-size:30px;
  font-weight:900;
}

.logo h1{
  color:var(--green);
  letter-spacing:2px;
}

.logo p{
  color:var(--muted);
  margin-top:5px;
}

.formGroup{
  margin-bottom:16px;
}

label{
  display:block;
  font-size:13px;
  font-weight:bold;
  margin-bottom:7px;
}

input,
select,
textarea{
  width:100%;
  padding:11px;
  border:1px solid var(--border);
  border-radius:8px;
  background:white;
  outline:none;
}

input:focus,
select:focus,
textarea:focus{
  border-color:var(--orange);
}
