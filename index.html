<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AGORA MUN — Chair Portal</title>

<style>
:root{
    --green:#173b32;
    --green2:#28584b;
    --green3:#376f60;

    --cream:#f7e8d3;
    --cream2:#fffaf2;
    --white:#ffffff;

    --orange:#d98b55;
    --orange2:#c97742;

    --text:#24312d;
    --muted:#718078;

    --border:#dfd1bd;

    --red:#b94d47;
    --red2:#9e3f3a;

    --shadow:0 12px 35px rgba(23,59,50,.10);
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:var(--cream);
    color:var(--text);
    min-height:100vh;
}

/* =========================
   LOGIN
========================= */

#loginScreen{
    position:fixed;
    inset:0;
    background:
        radial-gradient(circle at top right, rgba(217,139,85,.18), transparent 30%),
        var(--green);

    display:flex;
    justify-content:center;
    align-items:center;

    padding:20px;
    z-index:9999;
}

.loginBox{
    width:100%;
    max-width:420px;

    background:var(--cream2);

    padding:38px;

    border-radius:22px;

    box-shadow:
        0 30px 80px rgba(0,0,0,.30);

    animation:loginIn .35s ease;
}

@keyframes loginIn{
    from{
        opacity:0;
        transform:translateY(15px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

.logo{
    text-align:center;
    margin-bottom:30px;
}

.logoCircle{
    width:76px;
    height:76px;

    border-radius:50%;

    background:var(--orange);
    color:var(--green);

    display:flex;
    justify-content:center;
    align-items:center;

    margin:0 auto 15px;

    font-size:32px;
    font-weight:900;

    box-shadow:0 8px 20px rgba(217,139,85,.25);
}

.logo h1{
    color:var(--green);
    letter-spacing:3px;
    font-size:25px;
}

.logo p{
    color:var(--muted);
    margin-top:7px;
    font-size:14px;
}

.formGroup{
    margin-bottom:17px;
}

label{
    display:block;

    font-size:13px;
    font-weight:700;

    margin-bottom:7px;

    color:var(--green);
}

input,
select{
    width:100%;

    padding:12px 13px;

    border:1px solid var(--border);

    border-radius:9px;

    background:white;

    color:var(--text);

    outline:none;

    font-size:14px;

    transition:.2s;
}

input:focus,
select:focus{
    border-color:var(--orange);

    box-shadow:
        0 0 0 3px rgba(217,139,85,.12);
}

.loginButton,
.btn{
    border:none;

    border-radius:9px;

    padding:12px 16px;

    font-size:14px;
    font-weight:700;

    cursor:pointer;

    transition:.2s;
}

.loginButton{
    width:100%;

    background:var(--orange);
    color:white;

    margin-top:5px;
}

.loginButton:hover,
.btn:hover{
    transform:translateY(-1px);
}

.loginButton:hover{
    background:var(--orange2);
}

.loginError{
    display:none;

    margin-top:12px;

    padding:10px;

    background:#f8dddd;

    border:1px solid #e8b5b2;

    color:var(--red2);

    border-radius:8px;

    font-size:13px;

    text-align:center;
}

/* =========================
   APP
========================= */

#app{
    display:none;

    width:100%;
    max-width:1300px;

    margin:auto;

    padding:20px;
}

/* HEADER */

header{
    display:flex;

    justify-content:space-between;
    align-items:center;

    gap:15px;

    background:var(--green);

    color:var(--cream);

    padding:16px 22px;

    border-radius:16px;

    margin-bottom:20px;

    box-shadow:var(--shadow);
}

.headerLeft{
    display:flex;
    align-items:center;

    gap:13px;
}

.headerLogo{
    width:42px;
    height:42px;

    background:var(--orange);

    color:var(--green);

    border-radius:50%;

    display:flex;
    justify-content:center;
    align-items:center;

    font-weight:900;
}

.headerTitle{
    font-size:18px;
    font-weight:700;
}

.headerCommittee{
    color:#e8d9c7;
    font-size:13px;
    margin-top:3px;
}

.headerActions{
    display:flex;
    gap:8px;
}

.logoutBtn{
    background:var(--red);
    color:white;

    border:none;

    padding:9px 14px;

    border-radius:7px;

    cursor:pointer;

    font-weight:700;
}

.logoutBtn:hover{
    background:var(--red2);
}

/* =========================
   STATS
========================= */

.stats{
    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:15px;

    margin-bottom:20px;
}

.statCard{
    background:var(--cream2);

    border:1px solid var(--border);

    border-radius:14px;

    padding:17px;

    box-shadow:var(--shadow);
}

.statLabel{
    color:var(--muted);

    font-size:12px;

    margin-bottom:7px;
}

.statValue{
    color:var(--green);

    font-size:25px;

    font-weight:800;
}

/* =========================
   GRID
========================= */

.grid{
    display:grid;

    grid-template-columns:
        repeat(2,minmax(0,1fr));

    gap:20px;
}

.card{
    background:var(--cream2);

    border:1px solid var(--border);

    border-radius:15px;

    padding:20px;

    box-shadow:var(--shadow);
}

.card.full{
    grid-column:1 / -1;
}

.card h2{
    font-size:17px;

    color:var(--green);

    margin-bottom:16px;

    border-bottom:2px solid var(--border);

    padding-bottom:10px;
}

/* =========================
   TIMER
========================= */

.timerDisplay{
    font-size:58px;

    font-weight:800;

    text-align:center;

    color:var(--green);

    margin:12px 0 20px;

    font-family:
        "Courier New",
        monospace;
}

.timerInputs{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:10px;

    margin-bottom:12px;
}

.timerControls{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:8px;
}

.btn{
    color:white;

    background:var(--orange);
}

.btn:hover{
    background:var(--orange2);
}

.btn-secondary{
    background:var(--green2);
}

.btn-secondary:hover{
    background:var(--green3);
}

.btn-danger{
    background:var(--red);
}

.btn-danger:hover{
    background:var(--red2);
}

.btn-small{
    padding:7px 10px;
    font-size:12px;
}

/* =========================
   GSL
========================= */

.inlineForm{
    display:flex;

    gap:8px;

    margin-bottom:15px;
}

.inlineForm input{
    flex:1;
}

.speakerList{
    list-style:none;

    max-height:300px;

    overflow-y:auto;
}

.speakerItem{
    display:flex;

    align-items:center;

    gap:10px;

    padding:10px 12px;

    background:white;

    border:1px solid var(--border);

    border-radius:8px;

    margin-bottom:7px;

    transition:.2s;
}

.speakerItem.active{
    border-color:var(--orange);

    background:#fff5e9;

    box-shadow:
        0 0 0 2px rgba(217,139,85,.10);
}

.speakerNumber{
    width:27px;
    height:27px;

    display:flex;

    justify-content:center;
    align-items:center;

    border-radius:50%;

    background:var(--green);

    color:white;

    font-size:12px;

    font-weight:bold;

    flex-shrink:0;
}

.speakerName{
    flex:1;

    font-weight:600;
}

.speakerActions{
    display:flex;

    gap:5px;
}

.iconBtn{
    border:none;

    padding:6px 8px;

    border-radius:5px;

    cursor:pointer;

    background:var(--green2);

    color:white;

    font-size:11px;
}

.iconBtn.delete{
    background:var(--red);
}

/* =========================
   MOTION
========================= */

.motionGrid{
    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:12px;
}

.motionActions{
    display:flex;

    gap:8px;

    margin-top:12px;
}

.motionResult{
    margin-top:15px;

    padding:12px;

    background:white;

    border:1px solid var(--border);

    border-radius:8px;

    display:none;
}

.motionResult strong{
    color:var(--green);
}

/* =========================
   VOTES
========================= */

.voteGrid{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:10px;
}

.voteBox{
    text-align:center;

    background:white;

    border:1px solid var(--border);

    border-radius:10px;

    padding:12px;
}

.voteBox label{
    text-align:center;
}

.voteBox input{
    text-align:center;

    font-size:20px;

    font-weight:bold;
}

.voteTotal{
    margin-top:15px;

    padding:12px;

    border-radius:8px;

    background:var(--green);

    color:white;

    text-align:center;

    font-weight:bold;
}

/* =========================
   NOTES
========================= */

textarea{
    width:100%;

    min-height:180px;

    resize:vertical;

    padding:12px;

    border:1px solid var(--border);

    border-radius:9px;

    outline:none;

    font-family:Arial, sans-serif;

    font-size:14px;
}

textarea:focus{
    border-color:var(--orange);
}

.saveNotes{
    margin-top:10px;
}

/* =========================
   EMPTY
========================= */

.empty{
    text-align:center;

    padding:25px;

    color:var(--muted);

    font-size:13px;
}

/* =========================
   TOAST
========================= */

#toast{
    position:fixed;

    right:20px;
    bottom:20px;

    background:var(--green);

    color:white;

    padding:12px 17px;

    border-radius:9px;

    box-shadow:0 10px 30px rgba(0,0,0,.2);

    opacity:0;

    pointer-events:none;

    transform:translateY(10px);

    transition:.25s;

    z-index:10000;

    font-size:13px;
}

#toast.show{
    opacity:1;

    transform:translateY(0);
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:850px){

    .stats{
        grid-template-columns:
            repeat(2,1fr);
    }

    .grid{
        grid-template-columns:1fr;
    }

    .card.full{
        grid-column:auto;
    }
}

@media(max-width:600px){

    #app{
        padding:10px;
    }

    header{
        padding:14px;

        align-items:flex-start;
    }

    .headerTitle{
        font-size:15px;
    }

    .stats{
        grid-template-columns:
            repeat(2,1fr);

        gap:10px;
    }

    .statCard{
        padding:13px;
    }

    .grid{
        gap:12px;
    }

    .card{
        padding:15px;
    }

    .timerDisplay{
        font-size:45px;
    }

    .motionGrid,
    .voteGrid{
        grid-template-columns:1fr;
    }

    .loginBox{
        padding:27px 22px;
    }
}
</style>
</head>

<body>

<!-- =========================
     LOGIN
========================= -->

<div id="loginScreen">

    <div class="loginBox">

        <div class="logo">

            <div class="logoCircle">
                A
            </div>

            <h1>AGORA MUN</h1>

            <p>Chairperson Portal</p>

        </div>

        <form id="loginForm">

            <div class="formGroup">

                <label for="committee">
                    Committee Name
                </label>

                <input
                    id="committee"
                    type="text"
                    placeholder="e.g. UNODC"
                    required
                >

            </div>

            <div class="formGroup">

                <label for="username">
                    Username
                </label>

                <input
                    id="username"
                    type="text"
                    placeholder="Enter username"
                    autocomplete="username"
                    required
                >

            </div>

            <div class="formGroup">

                <label for="passcode">
                    Chair Passcode
                </label>

                <input
                    id="passcode"
                    type="password"
                    placeholder="Enter passcode"
                    autocomplete="current-password"
                    required
                >

            </div>

            <button
                type="submit"
                class="loginButton"
            >
                Enter Portal
            </button>

            <div
                id="loginError"
                class="loginError"
            >
                Invalid username or passcode.
            </div>

        </form>

    </div>

</div>


<!-- =========================
     APPLICATION
========================= -->

<div id="app">

    <header>

        <div class="headerLeft">

            <div class="headerLogo">
                A
            </div>

            <div>

                <div class="headerTitle">
                    AGORA MUN — Chair Portal
                </div>

                <div class="headerCommittee">
                    Committee:
                    <strong id="displayCommittee">
                        —
                    </strong>
                </div>

            </div>

        </div>

        <div class="headerActions">

            <button
                id="logoutBtn"
                class="logoutBtn"
            >
                Exit Portal
            </button>

        </div>

    </header>


    <!-- STATS -->

    <section class="stats">

        <div class="statCard">

            <div class="statLabel">
                GSL Speakers
            </div>

            <div
                id="speakerCount"
                class="statValue"
            >
                0
            </div>

        </div>

        <div class="statCard">

            <div class="statLabel">
                Active Speaker
            </div>

            <div
                id="activeSpeaker"
                class="statValue"
            >
                —
            </div>

        </div>

        <div class="statCard">

            <div class="statLabel">
                Total Votes
            </div>

            <div
                id="totalVotes"
                class="statValue"
            >
                0
            </div>

        </div>

        <div class="statCard">

            <div class="statLabel">
                Session
            </div>

            <div
                id="sessionStatus"
                class="statValue"
            >
                Ready
            </div>

        </div>

    </section>


    <div class="grid">

        <!-- ================= TIMER ================= -->

        <div class="card">

            <h2>
                Session Timer
            </h2>

            <div
                id="timer"
                class="timerDisplay"
            >
                01:30
            </div>

            <div class="timerInputs">

                <div>
                    <label for="timerMinutes">
                        Minutes
                    </label>

                    <input
                        id="timerMinutes"
                        type="number"
                        min="0"
                        value="1"
                    >
                </div>

                <div>
                    <label for="timerSeconds">
                        Seconds
                    </label>

                    <input
                        id="timerSeconds"
                        type="number"
                        min="0"
                        max="59"
                        value="30"
                    >
                </div>

            </div>

            <div class="timerControls">

                <button
                    class="btn"
                    id="startTimerBtn"
                >
                    Start
                </button>

                <button
                    class="btn btn-secondary"
                    id="pauseTimerBtn"
                >
                    Pause
                </button>

                <button
                    class="btn btn-danger"
                    id="resetTimerBtn"
                >
                    Reset
                </button>

            </div>

        </div>


        <!-- ================= GSL ================= -->

        <div class="card">

            <h2>
                General Speakers List
            </h2>

            <div class="inlineForm">

                <input
                    id="speakerInput"
                    type="text"
                    placeholder="Country / Delegate..."
                >

                <button
                    id="addSpeakerBtn"
                    class="btn"
                >
                    Add
                </button>

            </div>

            <ul
                id="speakersList"
                class="speakerList"
            ></ul>

        </div>


        <!-- ================= MOTIONS ================= -->

        <div class="card">

            <h2>
                Motion Control
            </h2>

            <div class="motionGrid">

                <div>

                    <label for="motionType">
                        Motion Type
                    </label>

                    <select id="motionType">

                        <option value="Open GSL">
                            Open GSL
                        </option>

                        <option value="Moderated Caucus">
                            Moderated Caucus
                        </option>

                        <option value="Unmoderated Caucus">
                            Unmoderated Caucus
                        </option>

                        <option value="Consultation of the Whole">
                            Consultation of the Whole
                        </option>

                        <option value="Suspension">
                            Suspension of the Meeting
                        </option>

                    </select>

                </div>

                <div>

                    <label for="motionDuration">
                        Duration
                    </label>

                    <input
                        id="motionDuration"
                        type="number"
                        min="1"
                        value="10"
                        placeholder="Minutes"
                    >

                </div>

            </div>

            <div class="motionActions">

                <button
                    id="startMotionBtn"
                    class="btn"
                >
                    Start Motion
                </button>

                <button
                    id="clearMotionBtn"
                    class="btn btn-secondary"
                >
                    Clear
                </button>

            </div>

            <div
                id="motionResult"
                class="motionResult"
            ></div>

        </div>


        <!-- ================= VOTING ================= -->

        <div class="card">

            <h2>
                Voting Counter
            </h2>

            <div class="voteGrid">

                <div class="voteBox">

                    <label for="voteFavor">
                        In Favor
                    </label>

                    <input
                        id="voteFavor"
                        type="number"
                        min="0"
                        value="0"
                    >

                </div>

                <div class="voteBox">

                    <label for="voteAgainst">
                        Against
                    </label>

                    <input
                        id="voteAgainst"
                        type="number"
                        min="0"
                        value="0"
                    >

                </div>

                <div class="voteBox">

                    <label for="voteAbstain">
                        Abstain
                    </label>

                    <input
                        id="voteAbstain"
                        type="number"
                        min="0"
                        value="0"
                    >

                </div>

            </div>

            <div
                id="voteTotal"
                class="voteTotal"
            >
                Total Votes: 0
            </div>

            <br>

            <button
                id="resetVotesBtn"
                class="btn btn-danger"
            >
                Reset Votes
            </button>

        </div>


        <!-- ================= NOTES ================= -->

        <div class="card full">

            <h2>
                Chair Notes
            </h2>

            <textarea
                id="chairNotes"
                placeholder="Write your private chair notes here..."
            ></textarea>

            <button
                id="saveNotesBtn"
                class="btn saveNotes"
            >
                Save Notes
            </button>

        </div>

    </div>

</div>


<div id="toast">
    Saved
</div>


<script>

/* =====================================================
   AGORA MUN — CHAIR PORTAL
===================================================== */

document.addEventListener("DOMContentLoaded", () => {

    /* =========================
       CONFIG
    ========================= */

    const VALID_USER = "chair";
    const VALID_PASS = "agora2026";

    const STORAGE_KEY = "agoraChairPortal";

    /* =========================
       ELEMENT
