<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AGORA MUN — Chair Portal</title>

<style>
:root{
    --green:#173B32;
    --green2:#245448;
    --green3:#31695A;
    --cream:#F4E5CF;
    --cream2:#FFF8ED;
    --orange:#D98B52;
    --orange2:#C8753E;
    --text:#17231F;
    --muted:#718078;
    --white:#FFFFFF;
    --danger:#B84A45;
    --success:#4C8566;
    --border:#E3D5C2;
    --shadow:0 10px 30px rgba(23,59,50,.10);
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:var(--cream);
    color:var(--text);
    min-height:100vh;
}

button,
input,
select,
textarea{
    font:inherit;
}

button{
    cursor:pointer;
}

/* ================= LOGIN ================= */

#loginScreen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:
        radial-gradient(
            circle at top right,
            rgba(217,139,82,.25),
            transparent 35%
        ),
        var(--green);
}

.login-box{
    width:100%;
    max-width:430px;
    background:var(--cream2);
    border-radius:24px;
    padding:42px;
    box-shadow:0 25px 70px rgba(0,0,0,.25);
}

.logo{
    text-align:center;
    margin-bottom:30px;
}

.logo-mark{
    width:72px;
    height:72px;
    margin:0 auto 15px;
    border-radius:50%;
    background:var(--orange);
    color:var(--green);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:30px;
    font-weight:900;
}

.logo h1{
    color:var(--green);
    font-size:28px;
    letter-spacing:2px;
}

.logo p{
    color:var(--muted);
    margin-top:6px;
    font-size:13px;
}

.form-group{
    margin-bottom:18px;
}

.form-group label{
    display:block;
    margin-bottom:7px;
    font-size:13px;
    font-weight:700;
}

.form-control{
    width:100%;
    padding:13px 14px;
    border:1px solid var(--border);
    background:white;
    border-radius:10px;
    outline:none;
    transition:.2s;
}

.form-control:focus{
    border-color:var(--orange);
    box-shadow:0 0 0 3px rgba(217,139,82,.15);
}

.login-btn{
    width:100%;
    border:none;
    padding:14px;
    border-radius:11px;
    background:var(--green);
    color:white;
    font-weight:800;
}

.login-btn:hover{
    background:var(--green2);
}

.login-error{
    color:var(--danger);
    font-size:13px;
    margin-top:12px;
    text-align:center;
    display:none;
}

/* ================= APP ================= */

#app{
    display:none;
    min-height:100vh;
}

.sidebar{
    position:fixed;
    left:0;
    top:0;
    bottom:0;
    width:245px;
    background:var(--green);
    color:white;
    padding:25px 15px;
    z-index:50;
}

.side-logo{
    padding:5px 12px 25px;
    border-bottom:1px solid rgba(255,255,255,.12);
    margin-bottom:18px;
}

.side-logo strong{
    font-size:21px;
    letter-spacing:1.5px;
}

.side-logo small{
    display:block;
    color:#BFD2C9;
    margin-top:5px;
}

.nav-btn{
    width:100%;
    border:none;
    background:transparent;
    color:#D7E2DD;
    text-align:left;
