<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AGORA MUN | Chair Portal</title>

<style>
:root{
    --green:#173B32;
    --green2:#245448;
    --green3:#31695A;
    --cream:#F5E6D0;
    --cream2:#FFF9F0;
    --orange:#D98B52;
    --orange2:#C8753E;
    --text:#17231F;
    --muted:#718078;
    --border:#E2D4C0;
    --danger:#B84A45;
    --success:#4C8566;
    --shadow:0 8px 25px rgba(23,59,50,.10);
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:var(--cream);
    color:var(--text);
}

button,input,select,textarea{
    font:inherit;
}

button{
    cursor:pointer;
}

/* ================= LOGIN ================= */

#loginScreen{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    background:
        radial-gradient(circle at top right,
        rgba(217,139,82,.28),
        transparent 35%),
        var(--green);
}

.login-box{
    width:100%;
    max-width:420px;
    background:var(--cream2);
    padding:42px;
    border-radius:24px;
    box-shadow:0 25px 70px rgba(0,0,0,.25);
}

.logo{
    text-align:center;
    margin-bottom:30px;
}

.logo-mark{
    width:72px;
    height:72px;
    border-radius:50%;
    margin:auto;
    margin-bottom:15px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--orange);
    color:var(--green);
    font-size:30px;
    font-weight:900;
}

.logo h1{
    color:var(--green);
    letter-spacing:2px;
}

.logo p{
    color:var(--muted);
    margin-top:6px;
}

.form-group{
    margin-bottom:17px;
}

.form-group label{
    display:block;
    font-size:13px;
    font-weight:700;
    margin-bottom:7px;
}

.form-control{
    width:100%;
    padding:12px 13px;
    border:1px solid var(--border);
    border-radius:9px;
    background:white;
    outline:none;
}

.form-control:focus{
    border-color:var(--orange);
    box-shadow:0 0 0 3px rgba(217,139,82,.15);
}
